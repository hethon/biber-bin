name: Republish Biber
on:
  workflow_dispatch:
    inputs:
      biber_version:
        description: Upstream Biber version on SourceForge
        required: true
        default: '2.17'
      tag:
        description: Release tag to create (e.g. v2.17, or v2.17-1 for a fix)
        required: true
        default: v2.17

permissions:
  contents: write

jobs:
  republish:
    runs-on: ubuntu-latest
    env:
      BIBER_VERSION: ${{ inputs.biber_version }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download and rename
        run: |
          set -euo pipefail
          [[ $BIBER_VERSION =~ ^[0-9]+(\.[0-9]+)+$ ]] || { echo "bad version" >&2; exit 1; }

          BASE="https://downloads.sourceforge.net/project/biblatex-biber/biblatex-biber/${BIBER_VERSION}/binaries"
          SF="https://sourceforge.net/projects/biblatex-biber/files/biblatex-biber/${BIBER_VERSION}/binaries"

          # upstream path | rust target triple
          TARGETS=(
            "Linux/biber-linux_x86_64.tar.gz|x86_64-unknown-linux-gnu"
            "Linux/biber-linux_x86_32.tar.gz|i686-unknown-linux-gnu"
            "Linux-musl/biber-linux_x86_64-musl.tar.gz|x86_64-unknown-linux-musl"
            "MacOS/biber-darwin_x86_64.tar.gz|x86_64-apple-darwin"
            "MacOS/biber-darwin_universal.tar.gz|universal2-apple-darwin"
            "Windows/biber-MSWIN64.zip|x86_64-pc-windows-gnu"
            "Windows/biber-MSWIN32.zip|i686-pc-windows-gnu"
          )

          mkdir -p out
          {
            echo "Biber ${BIBER_VERSION} binaries from SourceForge, renamed by Rust target triple (contents unchanged)."
            echo
            echo "| Archive | Upstream file |"
            echo "|---|---|"
          } > notes.md

          for entry in "${TARGETS[@]}"; do
            src=${entry%%|*}
            triple=${entry##*|}
            file=${src##*/}
            dest="out/biber-${triple}.${file#*.}"

            echo "${triple} <- ${file}"
            curl -fsSL --retry 5 --retry-all-errors -o "$dest" "${BASE}/${src}"

            echo "| \`${dest##*/}\` | [\`${file}\`](${SF}/${src%/*}/) |" >> notes.md
          done

          ls -lh out

      - name: Smoke test (native binary)
        run: |
          set -euo pipefail
          mkdir /tmp/biber-test
          tar -xzf out/biber-x86_64-unknown-linux-gnu.tar.gz -C /tmp/biber-test
          bin=$(find /tmp/biber-test -type f)
          chmod +x "$bin"
          v=$("$bin" --version)
          echo "$v"
          grep -qF "$BIBER_VERSION" <<<"$v"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$TAG" out/* \
            --title "biber ${BIBER_VERSION}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA"

      - name: Generate installers
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          npx --yes ingen-cli@0.4.1 sync installer.manifest.json --app-version "${TAG#v}"
          npx --yes ingen-cli@0.4.1 generate installer.manifest.json installers
          ls installers

      - name: Test installer
        run: |
          set -euo pipefail
          BIBER_UNMANAGED_INSTALL="$RUNNER_TEMP/bin" sh installers/installer.sh
          "$RUNNER_TEMP/bin/biber" --version

      - name: Upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$TAG" installers/* --clobber
